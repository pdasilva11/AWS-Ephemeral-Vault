name: Enforce path ownership
on:
  pull_request:
    paths: ['teams/**']

permissions:
  contents: read

jobs:
  check-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- teams/)
          BAD=0
          for f in $CHANGED; do
            TEAM=$(echo "$f" | cut -d/ -f2)
            case "${{ github.event.pull_request.user.login }}" in
              ramon01pro) [ "$TEAM" = "devops-dev" ] || [ "$TEAM" = "devops-prod" ] || BAD=1 ;;
              pdasilva11) [ "$TEAM" = "devops-prod" ] || BAD=1 ;;
              *) BAD=1 ;;
            esac
          done
          [ "$BAD" = "1" ] && { echo "::error::not permitted to modify another team's env files"; exit 1; } || true
