name: reconcile-devops-dev

# Replaces CodePipeline "Development" (infra/pipeline.yaml, TeamName=devops-dev):
#   Source -> Reconcile, auto-deploy on push to main, same path filters.
#
# Matches workload identity "PDS_Pipeline_dev" (actor = pdasilva11 or ramon01pro):
#   sub = repo:pdasilva11/AWS-Ephemeral-Vault:ref:refs/heads/main
# Do NOT add `environment:` to the deploy job, or the OIDC `sub` claim changes and the
# exchange will be denied (unless you re-register the identity with an Environment condition).

on:
  push:
    branches: [main]
    paths:
      - 'teams/devops-dev/**'
      - 'config/devops-dev.json'
      - 'infra/**'
      - 'registrar/**'
      - 'scripts/**'
      - '.github/workflows/reconcile.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reconcile-devops-dev   # never run two reconciles for the same team at once
  cancel-in-progress: false

jobs:
  lint:
    # No credentials: safe for pull requests, including forks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet --require-hashes -r .github/requirements-lint.txt
      - run: cfn-lint infra/*.yaml
      - run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('config/*.json')+glob.glob('teams/*/envs/*.json')]"

  deploy:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token
      contents: read
    env:
      TEAM: devops-dev
      AWS_DEFAULT_REGION: us-east-1
      WLC_SITE_ID: 432f36cf-46e2-4eb7-9e0a-5f928da51b6e
      WLC_SERVICE_NAME: PDS_Pipeline_dev
      # Full path of the dynamic secret, e.g. /Dev/deployer2 (repo variable).
      WLC_SECRET_PATH: ${{ vars.WLC_SECRET_PATH }}
      # OIDC audience BeyondTrust expects (repo variable). Leave unset to use
      # GitHub's default, https://github.com/<owner>.
      WLC_AUDIENCE: ${{ vars.WLC_AUDIENCE }}
      # Same values the CodeBuild project ps-eph-reconcile-devops-dev uses.
      REGISTRAR_ARN: ${{ vars.REGISTRAR_ARN }}
      ROLE_BOUNDARY_ARN: ${{ vars.ROLE_BOUNDARY_ARN }}
      VPC_ID: ${{ vars.VPC_ID }}
      SUBNET_ID: ${{ vars.SUBNET_ID }}
      CFN_EXEC_ROLE: ${{ vars.CFN_EXEC_ROLE }}
      BROKER_CIDR: ${{ vars.BROKER_CIDR }}
      OWNER_TAG: ${{ vars.OWNER_TAG }}
      STACK_PREFIX: ${{ vars.STACK_PREFIX }}
      FUNCTIONAL_ACCOUNT_PUBKEY_PARAM: ${{ vars.FUNCTIONAL_ACCOUNT_PUBKEY_PARAM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # CVE-2026-109518: GitHub's Ubuntu image ships an unpatched apt; with retries off the package swap can't happen
      - name: apt without retries
        run: |
          echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/zzz-no-retries
          echo 'Acquire::Retries "0";' | sudo tee -a /etc/apt/apt.conf
          grep -rn -i retries /etc/apt/ || true
          apt-config dump Acquire::Retries

      # Tephra runner sensor: records every DNS lookup, connection and program in this job, and blocks
      # anything not listed below. Records stream live to Tephra Trace, so they survive a deleted run.
      - name: Tephra runner sensor
        uses: tephrasecurity/sensor@d79be5ca62dfe2dfd00fd1c40b5a51d1bdaa2449 # v1.3.0
        with:
          egress-policy: block
          allowed-endpoints: |
            sts.us-east-1.amazonaws.com
            lambda.us-east-1.amazonaws.com
            cloudformation.us-east-1.amazonaws.com
            pypi.org
            files.pythonhosted.org
            api.beyondtrust.io
            trace.tephrasecurity.com
          console-url: https://trace.tephrasecurity.com

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet --require-hashes -r .github/requirements-deploy.txt

      - name: Install wlc
        # The Linux binary is attached to the release named wlc-cli in this repo.
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download wlc-cli -p wlc-linux-amd64 -O wlc
          chmod +x wlc
          ./wlc version

      - name: Get short-lived AWS credentials (workload identity)
        run: |
          set +x
          # 1. GitHub OIDC token. Omit the audience parameter unless WLC_AUDIENCE is set.
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [ -n "$WLC_AUDIENCE" ]; then URL="$URL&audience=$WLC_AUDIENCE"; fi
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          # Show the claims BeyondTrust matches on (no secret in these) so a denied
          # exchange can be compared with the workload identity's conditions.
          echo "$OIDC" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss,aud,sub,repository,repository_id,repository_owner_id,ref,actor}' || true

          # 2. Request the dynamic secret. stdin is not a TTY on a runner, so give wlc
          #    an empty stdin or it complains about piped input.
          #    UNVERIFIED: whether wlc exchanges the GitHub token itself.
          JSON=$(./wlc dynamic generate "${WLC_SECRET_PATH:?set the WLC_SECRET_PATH repo variable}" \
            --token "$OIDC" --service-name "$WLC_SERVICE_NAME" \
            --site-id "$WLC_SITE_ID" --format json --no-input < /dev/null)

          AK=$(echo "$JSON" | jq -r '(.secret // .).accessKeyId // empty')
          SK=$(echo "$JSON" | jq -r '(.secret // .).secretAccessKey // empty')
          ST=$(echo "$JSON" | jq -r '(.secret // .).sessionToken // empty')
          if [ -z "$AK" ] || [ -z "$SK" ] || [ -z "$ST" ]; then
            echo "::error::wlc did not return AWS credentials. Response keys: $(echo "$JSON" | jq -c 'paths|join(".")' 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          # Attrib: report this run's lease ID and a SHA-256 of the access key ID (no secrets). The runner
          # sensor adds them to the run's artifact so the console links the broker credential to this run exactly.
          LEASE=$(echo "$JSON" | jq -r '(.secret // .).leaseId // empty')
          echo "$LEASE $(printf %s "$AK" | sha256sum | cut -c1-64)" >> "$RUNNER_TEMP/tephra-wlc-leases"
          for v in "$AK" "$SK" "$ST"; do echo "::add-mask::$v"; done
          {
            echo "AWS_ACCESS_KEY_ID=$AK"
            echo "AWS_SECRET_ACCESS_KEY=$SK"
            echo "AWS_SESSION_TOKEN=$ST"
          } >> "$GITHUB_ENV"

      - name: Confirm assumed role
        run: aws sts get-caller-identity --query Arn --output text

      # Same as buildspec.yml: ship registrar/ before reconciling, so the deployed
      # function always matches what is on main.
      - name: Deploy registrar code
        run: |
          cd registrar && zip -qr /tmp/registrar.zip . && cd ..
          aws lambda update-function-code --function-name "$REGISTRAR_ARN" --zip-file fileb:///tmp/registrar.zip
          aws lambda wait function-updated --function-name "$REGISTRAR_ARN"

      - name: Reconcile
        run: python scripts/reconcile.py --team "$TEAM"

